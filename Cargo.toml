[package]
name = "music-audio-runtime-rust-bootstrap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# This manifest mirrors only the external dependency/feature surface required by
# the private music-audio-runtime workspace. It contains no project source.
[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.2.0", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-child-process",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
