name: Build offline Rust vendor bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/vendor.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustc +1.88.0 --version
          cargo +1.88.0 --version

      - name: Resolve and verify dependency set
        run: |
          cargo +1.88.0 generate-lockfile
          cargo +1.88.0 metadata --locked --format-version 1 >/dev/null
          cargo +1.88.0 check --locked

      - name: Vendor dependencies
        run: |
          rm -rf vendor bundle
          cargo +1.88.0 vendor --locked vendor > cargo-vendor-config.toml
          mkdir -p bundle/.cargo
          cp Cargo.lock bundle/Cargo.lock
          cp cargo-vendor-config.toml bundle/.cargo/config.toml
          cp -R vendor bundle/vendor
          {
            echo "rustc=$(rustc +1.88.0 --version)"
            echo "cargo=$(cargo +1.88.0 --version)"
            echo "manifest_sha256=$(sha256sum Cargo.toml | cut -d' ' -f1)"
            echo "lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
          } > bundle/BUNDLE_INFO.txt
          cat > bundle/README.txt <<'EOF'
          Offline Cargo source bundle for music-audio-runtime.

          Extract this bundle at a Rust workspace root so that:
            .cargo/config.toml
            vendor/
          are present beside the workspace Cargo.toml/Cargo.lock.

          The consuming workspace should use its own committed Cargo.lock and run
          Cargo with --locked --offline (or --frozen). The bundled Cargo.lock is
          the helper dependency lock used to construct this vendor snapshot.
          EOF

      - name: Commit lockfile when changed
        run: |
          if ! git diff --quiet -- Cargo.lock || ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Pin resolved Rust dependency set"
            git push origin HEAD:main
          fi

      - name: Package vendor bundle
        id: package
        run: |
          LOCK_SHA=$(sha256sum Cargo.lock | cut -d' ' -f1)
          SHORT_SHA=${LOCK_SHA:0:16}
          ARCHIVE="music-audio-runtime-rust-vendor-${SHORT_SHA}.tar.gz"
          tar -C bundle -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "lock_sha=$LOCK_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish or refresh release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: deps-${{ steps.package.outputs.short_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "Rust vendor ${{ steps.package.outputs.short_sha }}" \
              --notes "Offline Cargo vendor bundle generated and checked with Rust 1.88.0. Contains no private project source."
          fi

      - name: Upload short-lived sandbox bridge
        uses: actions/upload-artifact@v4
        with:
          name: vendor-bridge
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          compression-level: 0
          retention-days: 1
