name: Sandbox Rust 1.88 bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sandbox-rust-bridge.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88 with verification components
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.88.0
          rustc +1.88.0 --version
          cargo +1.88.0 --version
          rustfmt +1.88.0 --version
          cargo +1.88.0 clippy --version

      - name: Package Rust toolchain
        run: |
          set -euo pipefail
          RUSTC_PATH="$(rustup which --toolchain 1.88.0 rustc)"
          TOOLCHAIN_DIR="$(dirname "$(dirname "$RUSTC_PATH")")"
          mkdir -p bridge
          tar -C "$TOOLCHAIN_DIR" -czf bridge/rust-1.88.0-x86_64-unknown-linux-gnu.tar.gz .
          sha256sum bridge/rust-1.88.0-x86_64-unknown-linux-gnu.tar.gz > bridge/rust-1.88.0-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Download public vendor release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download deps-02f7da342da03ea9 \
            --pattern 'music-audio-runtime-rust-vendor-02f7da342da03ea9.tar.gz*' \
            --dir bridge
          sha256sum bridge/music-audio-runtime-rust-vendor-02f7da342da03ea9.tar.gz

      - name: Upload one-day sandbox bridge
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-rust-1-88-bridge
          path: bridge/
          compression-level: 0
          retention-days: 1
