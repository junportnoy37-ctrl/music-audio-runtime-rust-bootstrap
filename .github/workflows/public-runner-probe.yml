name: Public runner probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/public-runner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public hosted runner
        run: |
          echo PUBLIC_RUNNER_PROBE_OK
          uname -a
          rustc --version || true
