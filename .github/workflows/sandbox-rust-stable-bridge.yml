name: Sandbox Rust stable bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sandbox-rust-stable-bridge.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current stable verification toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustc +stable --version
          cargo +stable --version
          rustfmt +stable --version
          cargo +stable clippy --version

      - name: Package stable toolchain
        run: |
          set -euo pipefail
          RUSTC_PATH="$(rustup which --toolchain stable rustc)"
          TOOLCHAIN_DIR="$(dirname "$(dirname "$RUSTC_PATH")")"
          mkdir -p bridge
          tar -C "$TOOLCHAIN_DIR" -czf bridge/rust-stable-x86_64-unknown-linux-gnu.tar.gz .
          sha256sum bridge/rust-stable-x86_64-unknown-linux-gnu.tar.gz > bridge/rust-stable-x86_64-unknown-linux-gnu.tar.gz.sha256
          rustc +stable --version > bridge/rust-stable-version.txt

      - name: Upload one-day stable bridge
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-rust-stable-bridge
          path: bridge/
          compression-level: 0
          retention-days: 1
